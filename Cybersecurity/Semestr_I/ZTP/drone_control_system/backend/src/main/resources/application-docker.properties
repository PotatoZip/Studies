# Spring Boot Server Configuration
server.port=8081

# Application Name
spring.application.name=drone-control-system

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/drone_control_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=drone_user
spring.datasource.password=drone_password

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10

# Logging Configuration
logging.level.root=INFO
logging.level.com.drone=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Hibernate JDBC batching (telemetry batch persistence)
spring.jpa.properties.hibernate.order_inserts=true

# Redis (host/port supplied via SPRING_DATA_REDIS_* env vars in docker-compose)
spring.data.redis.host=redis
spring.data.redis.port=6379
# We use Redis only for caching + pub/sub, not Spring Data Redis repositories.
spring.data.redis.repositories.enabled=false

# JWT / Security (secret supplied via APP_JWT_SECRET env var)
app.jwt.secret=${APP_JWT_SECRET:change-me-in-production-this-is-a-dev-only-256-bit-secret-key}
app.jwt.expiration-ms=86400000

# CORS / WebSocket allowed origins (comma-separated)
app.cors.allowed-origins=http://frontend:8080,http://localhost:8080

# Drone latest-state cache TTL (seconds)
app.state.ttl-seconds=30

# Telemetry batch persistence
app.telemetry.batch.max-size=200
app.telemetry.batch.flush-interval-ms=2000

# MAVLink mock simulation
app.mavlink.simulation.enabled=true
app.mavlink.simulation.drone-count=3
app.mavlink.simulation.interval-ms=1000

# Full-pipeline mission simulation endpoint (POST /api/simulation/start)
app.simulation.enabled=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
