# Spring Boot Server Configuration
server.port=8081

# Application Name
spring.application.name=drone-control-system

# Database Configuration (H2 for local development)
spring.datasource.url=jdbc:h2:mem:dronedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.drone=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Hibernate JDBC batching (telemetry batch persistence)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Redis (Latest-State cache + Pub/Sub message broker)
spring.data.redis.host=localhost
spring.data.redis.port=6379
# We use Redis only for caching + pub/sub, not Spring Data Redis repositories.
spring.data.redis.repositories.enabled=false

# JWT / Security
app.jwt.secret=change-me-in-production-this-is-a-dev-only-256-bit-secret-key
app.jwt.expiration-ms=86400000

# CORS / WebSocket allowed origins (comma-separated)
app.cors.allowed-origins=http://localhost:8080,http://localhost:5173

# Drone latest-state cache TTL (seconds)
app.state.ttl-seconds=30

# Telemetry batch persistence
app.telemetry.batch.max-size=200
app.telemetry.batch.flush-interval-ms=2000

# MAVLink mock simulation
app.mavlink.simulation.enabled=true
app.mavlink.simulation.drone-count=3
app.mavlink.simulation.interval-ms=1000

# Full-pipeline mission simulation endpoint (POST /api/simulation/start)
app.simulation.enabled=true
